// --- time (Asia/Tokyo) ---
function jst() { const n = new Date(); return new Date(n.getTime() + (n.getTimezoneOffset() + 540) * 60000); }
const pad = n => String(n).padStart(2, '0');
const now = jst();
const todayStr = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;
const nowMin = now.getHours() * 60 + now.getMinutes();
const tripDay = D.days.find(d => d.date === todayStr);
const mins = t => { const m = /(\d{1,2}):(\d{2})/.exec(t || ''); return m ? +m[1] * 60 + +m[2] : null; };
const endMins = t => { const all = [...String(t || '').matchAll(/(\d{1,2}):(\d{2})/g)]; return all.length > 1 ? +all[1][1] * 60 + +all[1][2] : null; };
const md = date => date.slice(5).replace('-', '/').replace(/^0/, '').replace('/0', '/');

// --- state ---
const defaultPicks = {};
D.days.forEach(d => d.items.forEach(it => { if (it.type === 'slot' && it.chosen) defaultPicks[it.id] = it.chosen.slice(); }));
const S = {
  tab: store.get('tab', 'plan'),
  day: tripDay ? tripDay.id : store.get('day', 'd1'),
  style: store.get('style', 'techo'),
  picks: store.get('picks', defaultPicks),
  bought: store.get('bought', {}),
  todo: store.get('todo', {}),
  area: 'all', cat: 'all',
  open: new Set(store.get('open', []))
};
function applyStyle() {
  if (S.style && S.style !== 'kaizu') document.documentElement.dataset.style = S.style;
  else delete document.documentElement.dataset.style;
}

// --- place helpers ---
function navUrl(p, mode) {
  const a = p.address_ja || '';
  const dest = /\d/.test(a) ? a : (p.name_ja || p.name_zh);
  return `https://www.google.com/maps/dir/?api=1&destination=${enc(dest)}&travelmode=${mode === 'walk' ? 'walking' : 'driving'}`;
}
const mapUrl = p => `https://www.google.com/maps/search/?api=1&query=${enc(((p.name_ja || p.name_zh) + ' ' + (p.address_ja || '')).trim())}`;
const threadsUrl = q => `https://www.threads.com/search?q=${enc(q)}`;
const phoneOf = p => (p.phone || '').split(/[（(／/]/)[0].trim();
// Only trusts closed_days (a field that lists closures) plus an explicit "10/5（一）公休" in open_during_trip.
function closedOn(p, date) {
  if (!date) return false;
  const dt = new Date(date + 'T12:00:00Z'), w = dt.getUTCDay(), nth = Math.ceil(dt.getUTCDate() / 7);
  if (new RegExp(`${md(date)}\\s*[（(][^）)]*[）)]\\s*公休`).test(p.open_during_trip || '')) return true;
  const c = (p.closed_days || '').replace(/[１-５]/g, d => '１２３４５'.indexOf(d) + 1);
  if (!c || /無休/.test(c)) return false;
  for (const day of ['日月火水木金土'[w] + '曜', '週' + '日一二三四五六'[w], '星期' + '日一二三四五六'[w]]) {
    const re = new RegExp(`(第([0-9・,、]+)個?)?${day}`, 'g');
    for (const m of c.matchAll(re)) {
      if (!m[2]) return true;
      if (m[2].split(/[・,、]/).map(Number).includes(nth)) return true;
    }
  }
  return false;
}
function legText(v, mode) {
  if (!v || v === '—') return '';
  return /^\d/.test(v) ? `${mode === 'walk' ? '走' : '開車'} ${v} 分` : v;
}

function placeInfo(p, key) {
  const sig = (p.signature || []).filter(s => typeof s === 'object' ? (s.zh || s.ja) : s);
  const phone = phoneOf(p);
  const rows = [
    ['時間', p.hours], ['公休', p.closed_days], ['這幾天', p.open_during_trip], ['價格', p.price],
    ['停車', p.parking], ['預約', p.reservation], ['地址', p.address_ja]
  ].filter(r => r[1]);
  const dishes = sig.length ? `<div>${sig.map(s => typeof s === 'object'

  const all = Object.values(P).filter(p => p.category && !['service'].includes(p.category));
  const list = all.filter(p => (S.area === 'all' || p.area === S.area) && (S.cat === 'all' || (S.cat === 'rain' ? (p.rain_ok || p.category === 'rain') : p.category === S.cat)))
    .sort((a, b) => (a.stub ? 1 : 0) - (b.stub ? 1 : 0) || (a.name_zh || '').localeCompare(b.name_zh || '', 'zh-Hant'));
  const quick = ['駐車場', 'コンビニ', 'ガソリンスタンド', 'カフェ', '沖縄そば', 'トイレ'];
  const qzh = {'駐車場':'停車場','コンビニ':'便利商店','ガソリンスタンド':'加油站','カフェ':'咖啡','沖縄そば':'沖繩麵','トイレ':'廁所'};
  return `<div class="sec"><h2>我附近</h2>
    <p class="small muted">用手機 Google Maps 搜你現在的位置附近。</p>
    <div class="row">${quick.map(q => `<a class="btn" href="https://www.google.com/maps/search/${enc(q)}" target="_blank" rel="noopener">${esc(qzh[q])}</a>`).join('')}</div></div>
    <div class="sec"><h2>我們查過的地方</h2>
    <div class="filters" role="group" aria-label="區域">${[['all','全部'], ...Object.entries(AREA)].map(([k, v]) => `<button class="fbtn" data-act="area" data-id="${k}" aria-pressed="${S.area === k}">${esc(v)}</button>`).join('')}</div>
    <div class="filters" role="group" aria-label="類別">${[['all','全部'],['eat','吃'],['drink','喝'],['play','玩'],['rain','雨天'],['shop','買'],['parking','停車'],['event','活動']].map(([k, v]) => `<button class="fbtn" data-act="cat" data-id="${k}" aria-pressed="${S.cat === k}">${esc(v)}</button>`).join('')}</div>
    <p class="small muted">${list.length} 個地點</p>
    <div class="list">${list.map(p => `<article class="opt">
      <div class="row"><span class="chip">${esc(CAT[p.category] || '')}</span><span class="chip">${esc(AREA[p.area] || '')}</span>${p.rain_ok ? '<span class="chip info">下雨可</span>' : ''}</div>
      <h5>${esc(p.name_zh || p.name_ja)}</h5>${p.name_ja && p.name_ja !== p.name_zh ? `<p class="tiny muted">${esc(p.name_ja)}</p>` : ''}
      ${p.hours ? `<p class="legs">${esc(p.hours)}</p>` : ''}
      <div class="row acts"><a class="btn" href="${navUrl(p)}" target="_blank" rel="noopener">${ico('nav')}導航</a></div>
      ${placeInfo(p, 'n-' + p.id)}</article>`).join('')}</div></div>`;
}

// --- shopping view ---
function renderShop() {
  const sh = D.shopping || {}; const items = sh.items || []; const rules = sh.rules || {};
  const cats = [...new Set(items.map(i => i.category))];
  const done = items.filter(i => S.bought[i.id]).length;
  const tw = t => /禁止/.test(t) ? 'bad' : /限/.test(t) ? 'warn' : 'ok';
  return `<div class="sec"><h2>必買清單</h2>
    <p class="small muted">已買 ${done}／${items.length}。勾選只記在你這支手機。</p>
    <div class="info">
      ${rules.taiwan_import ? `<p><b>帶回台灣：</b>${esc(rules.taiwan_import)}</p>` : ''}
      ${rules.tax_free ? `<p><b>免稅：</b>${esc(rules.tax_free)}</p>` : ''}
    </div></div>
    ${cats.map(c => `<div class="sec"><h2>${esc(c)}</h2><div class="list">${items.filter(i => i.category === c).map(i => `<div class="item">
      <button class="check" data-act="bought" data-id="${esc(i.id)}" aria-pressed="${!!S.bought[i.id]}"><span class="box" aria-hidden="true"></span><span><span class="ttl"><b>${esc(i.name_zh)}</b></span><br><span class="jpbig">${esc(i.name_ja)}</span></span></button>
      <div class="row"><span class="chip ${tw(i.taiwan_ok || '')}">${esc((i.taiwan_ok || '').split(/[，,（(]/)[0])}</span>${i.carry ? `<span class="chip">${esc(i.carry)}</span>` : ''}${i.price ? `<span class="chip">${esc(i.price)}</span>` : ''}</div>
      <p class="small">${esc((i.where || []).join('、'))}</p>
      ${i.tips ? `<p class="small muted">${esc(i.tips)}</p>` : ''}
      <div class="row"><button class="btn" data-act="staffitem" data-id="${esc(i.id)}">給店員看</button></div>
    </div>`).join('')}</div></div>`).join('')}`;
}

// --- news view ---
function renderNews() {
  const n = D.news || {};
  const q = ['青の洞窟','うんなまつり 花火','美浜 花火','瀬長島','古宇利島','沖縄 渋滞'];
  return `${newsWx()}
    <div class="sec"><h2>會影響行程的消息</h2><p class="small muted">資料時間：${esc(n.retrieved_at || '')}</p><div class="list">${(n.news || []).map(x => `<div class="item">
      <div class="row"><span class="chip">${esc(x.date)}</span><span class="chip ${x.confidence === 'high' ? 'ok' : 'warn'}">可信度 ${esc({high:'高',med:'中',low:'低'}[x.confidence] || '')}</span></div>
      <p><b>${esc(x.title_zh)}</b></p><p class="small">${esc(x.impact_zh)}</p>
      ${x.source ? `<div class="src"><a href="${esc(x.source)}" target="_blank" rel="noopener">來源</a></div>` : ''}</div>`).join('')}</div></div>
    <div class="sec"><h2>最近很紅</h2><p class="small muted">Threads 大多要登入才看得到，這裡標明每則的來源平台。現場想看最新的，用下面的 Threads 按鈕直接搜。</p>
      <div class="row">${q.map(s => `<a class="btn" href="${threadsUrl(s)}" target="_blank" rel="noopener">Threads：${esc(s)}</a>`).join('')}</div>
      <div class="list">${(n.trending || []).map(t => `<div class="item"><div class="row"><span class="chip acc">${esc(t.platform)}</span><span class="chip">${esc(AREA[t.area] || '')}</span></div>
        <p><b>${esc(t.name_zh)}</b> <span class="tiny muted">${esc(t.name_ja || '')}</span></p><p class="small">${esc(t.why_zh)}</p>
        ${t.url ? `<div class="src"><a href="${esc(t.url)}" target="_blank" rel="noopener">看原文</a></div>` : ''}</div>`).join('')}</div></div>`;
}

// --- info view ---
function picksText() {
  const lines = [];
  D.days.forEach(d => d.items.forEach(it => {
    if (it.type !== 'slot') return;
    const ids = S.picks[it.id] || [];
    if (ids.length) lines.push(`${md(d.date)} ${it.title}：${ids.map(id => (P[id] || {}).name_zh || id).join('、')}`);
  }));
  return lines.length ? lines.join('\n') : '還沒選任何選項';
}
function renderInfo() {
  const hotel = P[D.trip.hotel] || {};
  return `<div class="sec"><h2>視覺風格</h2><div class="styles">${STYLES.map(s => `<button class="sw" data-act="style" data-id="${s.id}" aria-pressed="${(S.style || 'kaizu') === s.id}"><span class="bar">${s.colors.map(c => `<i style="background:${c}"></i>`).join('')}</span><b>${esc(s.label)}</b></button>`).join('')}</div></div>
    <div class="sec"><h2>出發前待辦</h2><div class="list">${D.todos.map(t => `<button class="check" data-act="todo" data-id="${esc(t.id)}" aria-pressed="${!!S.todo[t.id]}"><span class="box" aria-hidden="true"></span><span><span class="ttl">${esc(t.text)}</span><br><span class="tiny muted">${esc(t.due)}${t.phone ? ` · ${esc(t.phone)}` : ''}</span></span></button>`).join('')}</div></div>
    <div class="sec"><h2>我的選擇</h2><p class="small muted">選擇只存在你這支手機。複製後貼到 LINE 群組，或貼給 Claude 更新成大家的版本。</p>
      <div class="info"><p style="white-space:pre-line">${esc(picksText())}</p></div>
      <div class="row"><button class="btn primary" data-act="copypicks">${ico('copy')}複製我的選擇</button></div></div>
    <div class="sec"><h2>飯店</h2><div class="item"><p><b>${esc(hotel.name_ja || '')}</b></p><p class="small">${esc(hotel.address_ja || '')}</p><p class="small muted">${esc(hotel.parking || '')}</p>
      <div class="row"><button class="btn primary" data-act="taxi">給司機看地址</button>${hotel.address_ja ? `<button class="btn" data-act="copy" data-text="${esc(hotel.address_ja)}">${ico('copy')}複製地址</button>` : ''}</div></div></div>
    <div class="sec"><h2>緊急電話</h2><div class="list">${D.emergency.map(e => `<div class="item"><div class="row" style="justify-content:space-between"><span>${esc(e.label)}</span><button class="btn" data-act="copy" data-text="${esc(e.value)}"><span class="mono">${esc(e.value)}</span></button></div></div>`).join('')}</div></div>
    <div class="sec"><h2>點餐會話卡</h2><div class="row"><button class="btn primary" data-act="phrases">打開會話卡</button></div></div>
    <div class="sec"><h2>自駕守則</h2><div class="info">${D.rules.map(r => `<p>${esc(r)}</p>`).join('')}</div></div>
    <div class="sec"><h2>資料說明</h2><p class="small muted">店家資料在 9/28 查證，每個地點都標了可信度和來源。大部分店家查不到 MAPCODE，車機導航改輸入電話，或直接用手機 Google Maps。車程是路況順時的估計，另外加了緩衝時間。</p></div>`;
}

// --- dialogs ---
const dlg = $('#dlg'), body = $('#dlgbody');
function openDlg(html) { body.innerHTML = html + '<button class="btn primary" data-act="close">關閉</button>'; if (dlg.showModal) dlg.showModal(); else dlg.setAttribute('open', ''); }
const phrasesHtml = () => (D.phrases || []).map(x => `<div><p class="mid">${esc(x.ja)}</p><p class="zh">${esc(x.zh)} · ${esc(x.romaji || '')}</p></div>`).join('<hr>');

// --- render ---
function renderTabs() {
  const T = [['plan','行程'],['near','附近'],['shop','必買'],['news','情報'],['info','資訊']];
  $('#tabs').innerHTML = T.map(([k, v]) => `<button class="tab" data-act="tab" data-id="${k}"${S.tab === k ? ' aria-current="page"' : ''}>${ico(k)}<span>${v}</span></button>`).join('');
  $('#days').innerHTML = D.days.map(d => `<button class="daybtn" data-act="day" data-id="${d.id}" aria-pressed="${S.day === d.id}">${esc(md(d.date))}（${esc(d.dow)}）${d.date === todayStr ? '<span class="today">今天</span>' : ''}</button>`).join('');
  $('#days').hidden = S.tab !== 'plan';
}
function render() {
  applyStyle(); renderTabs();
  const v = $('#view');
  v.innerHTML = {plan: renderPlan, near: renderNear, shop: renderShop, news: renderNews, info: renderInfo}[S.tab]();
}

// --- events ---
let tt;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 2200); }
function copy(text) {
  const done = () => toast('已複製 ' + (text.length > 24 ? text.slice(0, 24) + '…' : text));
  try {
    navigator.clipboard.writeText(text).then(done, () => fallback(text));
  } catch (e) { fallback(text); }
}
function fallback(text) {
  openDlg(`<p class="zh">長按下面的文字選取複製</p><p class="mid" style="user-select:all;white-space:pre-line">${esc(text)}</p>`);
}
document.addEventListener('toggle', e => {
  const el = e.target; if (!el.matches || !el.matches('details[data-key]')) return;
  const k = el.dataset.key;
  el.open ? S.open.add(k) : S.open.delete(k);
  store.set('open', [...S.open].slice(-80));
  if (el.classList.contains('opts')) { const s = el.querySelector(':scope>summary'); const n = el.querySelectorAll('.opt').length; s.textContent = el.open ? '收起選項' : `看 ${n} 個選項`; }
}, true);
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const {act, id} = b.dataset;
  if (act === 'tab') { S.tab = id; store.set('tab', id); render(); window.scrollTo(0, 0); }
  else if (act === 'day') { S.day = id; store.set('day', id); render(); window.scrollTo(0, 0); }
  else if (act === 'style') { S.style = id; store.set('style', id); render(); toast('已換成 ' + STYLES.find(s => s.id === id).label); }
  else if (act === 'pick') {
    const slot = b.dataset.slot, cur = S.picks[slot] || [];
    const on = cur.includes(id);
    S.picks = {...S.picks, [slot]: on ? cur.filter(x => x !== id) : [...cur, id]};
    store.set('picks', S.picks);
    const y = window.scrollY; render(); window.scrollTo(0, y);
    toast(on ? '已從行程移除' : '已加入行程');
  }
  else if (act === 'bought' || act === 'todo') {
    const key = act === 'bought' ? 'bought' : 'todo';
    S[key] = {...S[key], [id]: !S[key][id]}; store.set(key, S[key]);
    b.setAttribute('aria-pressed', String(!!S[key][id]));
  }
  else if (act === 'area') { S.area = id; render(); }
  else if (act === 'cat') { S.cat = id; render(); }
  else if (act === 'copy') copy(b.dataset.text);
  else if (act === 'copypicks') copy(picksText());
  else if (act === 'staff') {
    const p = P[id];
    const sig = (p.signature || []).filter(s => typeof s === 'object');
    openDlg(`<p class="zh" id="dlgttl">給店員看</p><p class="big">${esc(p.name_ja || p.name_zh)}</p>
      ${sig.map(s => `<div><p class="mid">${esc(s.ja || s.zh)}</p><p class="zh">${esc(s.zh || '')} ${esc(s.price || '')}</p></div>`).join('<hr>')}
      <hr><p class="mid">4人です。</p><p class="zh">我們 4 個人</p><hr>${phrasesHtml()}`);
  }
  else if (act === 'staffitem') {
    const i = (D.shopping.items || []).find(x => x.id === id);
    openDlg(`<p class="zh" id="dlgttl">給店員看</p><p class="big">${esc(i.name_ja)}</p><p class="mid">これはありますか？</p><p class="zh">請問有這個嗎？（${esc(i.name_zh)}）</p>`);
  }
  else if (act === 'taxi') {
    const h = P[D.trip.hotel] || {};
    openDlg(`<p class="zh" id="dlgttl">給計程車司機看</p><p class="mid">このホテルまでお願いします。</p><p class="big">${esc(h.name_ja || '')}</p><p class="mid">${esc(h.address_ja || '')}</p><p class="zh">請載我們到這間飯店</p>`);
  }
  else if (act === 'phrases') openDlg(`<p class="zh" id="dlgttl">點餐會話卡</p>${phrasesHtml()}`);
  else if (act === 'close') dlg.close ? dlg.close() : dlg.removeAttribute('open');
});
dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });
render();
loadWx();
setInterval(() => { if (!document.hidden) loadWx(); }, 30 * 60 * 1000);
})();
</script>
</body></html>
