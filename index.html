<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><style>body{margin:0}[hidden]{display:none!important}</style></head><body><title>沖繩五日自駕</title>
<meta name="description" content="10/1–10/5 沖繩自駕：固定行程、空檔選項、導航、停車、點餐卡與必買清單">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@500&family=Shippori+Mincho:wght@600;700&family=Klee+One:wght@600&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
:root{
  color-scheme: light;
  --bg:#EAF3F5; --surface:#FFFFFF; --surface-2:#F2F8F9; --ink:#0E2A3A; --ink-2:#3B6474; --line:#CFE0E5; --line-2:#A9C6CE;
  --accent:#C4431C; --accent-soft:#FBE3DA; --accent-ink:#9E3515;
  --action:#0E2A3A; --on-action:#FFFFFF;
  --ok:#1D6B45; --ok-soft:#DDF1E6; --warn:#7A4E00; --warn-soft:#FCEFCF; --bad:#A8231A; --bad-soft:#FCE3DF; --info:#1F5A7A; --info-soft:#DCEDF5;
  --chip:#DCEBEF; --chip-ink:#23495A;
  --head-bg:var(--bg); --head-ink:var(--ink); --head-ink-2:var(--ink-2); --head-rule:transparent;
  --rail:2px dashed #E08A6C; --dot:var(--accent);
  --radius:14px; --radius-sm:10px;
  --font-body:"Noto Sans TC",system-ui,-apple-system,"PingFang TC",sans-serif;
  --font-head:"Noto Sans TC",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --paper:none;
  --z-sticky:10; --z-nav:20; --z-toast:40;
}
:root[data-style="road"]{
  --bg:#EEF1F5; --surface:#FFFFFF; --surface-2:#F4F6F9; --ink:#0D1B2E; --ink-2:#44536A; --line:#D3DAE4; --line-2:#9AA8BD;
  --accent:#1D4F9A; --accent-soft:#E0E9F6; --accent-ink:#163F7C; --action:#1D4F9A;
  --chip:#E3E8F0; --chip-ink:#23324A;
  --head-bg:#1D4F9A; --head-ink:#FFFFFF; --head-ink-2:#DCE6F5;
  --rail:3px solid #B9C4D4; --dot:#1D4F9A; --radius:8px; --radius-sm:6px;
}
:root[data-style="bingata"]{
  --bg:#FFFFFF; --surface:#FFFFFF; --surface-2:#F5F6FA; --ink:#1E2A44; --ink-2:#4A5570; --line:#E1E4EC; --line-2:#B8BFD0;
  --accent:#C8412E; --accent-soft:#FBE4DF; --accent-ink:#A33423; --action:#1E3A6B;
  --chip:#ECEFF6; --chip-ink:#2A3656;
  --head-bg:#F2C230; --head-ink:#1E2A44; --head-ink-2:#4F3C0B; --head-rule:#C8412E;
  --rail:2px dotted #1E3A6B; --dot:#C8412E; --radius:16px;
  --font-head:"Shippori Mincho","Noto Serif TC",serif;
}
:root[data-style="techo"]{
  --bg:#F6F8FB; --surface:#FFFFFF; --surface-2:#F3F6FA; --ink:#23262B; --ink-2:#565D69; --line:#E1E7F0; --line-2:#BAC5D6;
  --accent:#2E6F8E; --accent-soft:#DDEEF5; --accent-ink:#24586F; --action:#2E6F8E;
  --chip:#EEF1F6; --chip-ink:#343B47;
  --rail:2px dashed #9DB9C8; --dot:#E0795A; --radius:20px; --radius-sm:14px;
  --font-head:"Klee One","Zen Maru Gothic",cursive;
  --font-body:"Zen Maru Gothic","Noto Sans TC",system-ui,sans-serif;
  --paper:repeating-linear-gradient(to bottom,transparent 0 31px,#E6ECF4 31px 32px);
}
*{box-sizing:border-box}
body{background:var(--bg);background-image:var(--paper);color:var(--ink);font:400 16px/1.6 var(--font-body);-webkit-text-size-adjust:100%;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
button,a{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4{margin:0;text-wrap:balance;font-family:var(--font-head)}
p{margin:0}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px}
.mono{font-family:var(--font-mono);letter-spacing:.02em}
.muted{color:var(--ink-2)}
.small{font-size:14px}
.tiny{font-size:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.stack{display:grid;gap:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.ico{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:var(--z-sticky);background:var(--head-bg);color:var(--head-ink);border-bottom:4px solid var(--head-rule);padding-block:12px 10px}
:root:not([data-style]) .top,:root[data-style="techo"] .top{background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:saturate(1.2) blur(8px);border-bottom:1px solid var(--line)}
.top .coord{font-size:12px;color:var(--head-ink-2)}
.top h1{font-size:20px;font-weight:700;line-height:1.3}
.days{display:flex;gap:6px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.daybtn{flex:none;border:1.5px solid var(--line-2);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;min-height:40px;font-size:14px;font-weight:500;display:flex;gap:6px;align-items:center}
.daybtn[aria-pressed="true"]{background:var(--action);border-color:var(--action);color:var(--on-action)}
:root[data-style="road"] .daybtn{background:transparent;color:#FFFFFF;border-color:#8FAAD6}
:root[data-style="road"] .daybtn[aria-pressed="true"]{background:#FFFFFF;color:#1D4F9A;border-color:#FFFFFF}
:root[data-style="bingata"] .daybtn{border-color:#1E2A44}
.daybtn .today{font-size:11px;padding:1px 6px;border-radius:999px;background:var(--accent);color:#fff}

/* day header */
.dayhead{padding-block:18px 8px;display:grid;gap:6px}
.dayhead h2{font-size:24px;font-weight:700;line-height:1.25}
.facts{display:flex;flex-wrap:wrap;gap:6px}

/* chips */
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:500;line-height:1.4;padding:3px 9px;border-radius:999px;background:var(--chip);color:var(--chip-ink);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.acc{background:var(--accent-soft);color:var(--accent-ink)}
.chip.info{background:var(--info-soft);color:var(--info)}
:root[data-style="road"] .chip.now{background:#F5C400;color:#2B2200}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:8px 14px;border-radius:var(--radius-sm);border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-size:14px;font-weight:500;text-decoration:none;transition:transform .15s ease-out,background-color .15s ease-out}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--action);border-color:var(--action);color:var(--on-action)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2);padding-inline:8px}
.btn.pick[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
:root[data-style="techo"] .btn{border-radius:999px}

/* timeline */
.tl{position:relative;display:grid;gap:12px;padding-left:26px;padding-bottom:8px}
.tl::before{content:"";position:absolute;left:9px;top:10px;bottom:10px;border-left:var(--rail)}
.tl>*{position:relative}
.tl>*::before{content:"";position:absolute;left:-22px;top:18px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2.5px solid var(--dot)}
.tl>.move::before{width:8px;height:8px;left:-20px;top:14px;border-width:2px;border-color:var(--line-2)}
.tl>.is-now::before{background:var(--dot)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.card.is-now{border:2px solid var(--accent);padding:13px}
.card .time{font-size:14px;font-weight:700;color:var(--accent-ink);font-variant-numeric:tabular-nums}
.card h3{font-size:18px;font-weight:700;line-height:1.35;margin-top:2px}
.card .ja{font-size:13px;color:var(--ink-2)}
.card .note{font-size:14px;color:var(--ink-2);margin-top:6px}
.card .acts{margin-top:10px}

.move{display:flex;gap:10px;align-items:flex-start;padding:4px 2px;color:var(--ink-2);font-size:14px}
.move b{color:var(--ink);font-weight:500}
.move .legs{font-variant-numeric:tabular-nums}

.slot{border:1.5px dashed var(--line-2);border-radius:var(--radius);padding:14px;background:color-mix(in srgb,var(--surface) 55%,transparent)}
.slot .time{font-size:14px;font-weight:700;color:var(--ink-2);font-variant-numeric:tabular-nums}
.slot h3{font-size:18px;font-weight:700}
.slot .route{font-size:14px;color:var(--ink-2)}
.slot .note{font-size:14px;margin-top:6px}
.chosen{display:grid;gap:10px;margin-top:12px}
.empty{font-size:14px;color:var(--ink-2);padding:10px 12px;border-radius:var(--radius-sm);background:var(--surface-2)}

details>summary{list-style:none;cursor:pointer}
details>summary::-webkit-details-marker{display:none}
.opts{margin-top:12px}
.opts>summary{display:flex;align-items:center;justify-content:center;gap:6px;min-height:44px;border-radius:var(--radius-sm);background:var(--action);color:var(--on-action);font-weight:500;font-size:15px}
.opts[open]>summary{background:var(--surface);color:var(--ink);border:1px solid var(--line-2)}
.group{margin-top:14px}
.group>h4{font-size:13px;font-weight:700;color:var(--ink-2);margin-bottom:8px;font-family:var(--font-body)}
.opt{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px;display:grid;gap:4px}
.opt+.opt{margin-top:8px}
.opt h5{margin:0;font-size:16px;font-weight:700;font-family:var(--font-body)}
.opt .why{font-size:13px;color:var(--ink-2)}
.blurb{font-size:15px;line-height:1.55;margin-top:2px}
.opt .legs{font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.opt .acts{margin-top:6px}

.more>summary{display:inline-flex;align-items:center;min-height:40px;padding:8px 12px;font-size:14px;font-weight:500;color:var(--ink-2)}
.more[open]>summary{color:var(--accent-ink)}
.info{display:grid;gap:8px;margin-top:6px;padding:12px;border-radius:var(--radius-sm);background:var(--surface-2);font-size:14px}
.kv{display:grid;grid-template-columns:4.5em 1fr;gap:4px 10px}
.kv dt{color:var(--ink-2)}
.kv dd{margin:0;overflow-wrap:anywhere}
.dish{display:grid;grid-template-columns:1fr auto;gap:0 10px;padding:6px 0;border-bottom:1px solid var(--line)}
.dish:last-child{border-bottom:0}
.dish .jp{font-size:13px;color:var(--ink-2)}
.src a{color:var(--info);font-size:12px;overflow-wrap:anywhere}


/* sections in other tabs */
.sec{padding-block:18px 4px;display:grid;gap:12px}
.sec>h2{font-size:20px;font-weight:700}
.list{display:grid;gap:8px}
.filters{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.filters::-webkit-scrollbar{display:none}
.fbtn{flex:none;min-height:36px;padding:5px 12px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);font-size:14px}
.fbtn[aria-pressed="true"]{background:var(--action);border-color:var(--action);color:var(--on-action)}
.check{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px}
.box{flex:none;width:24px;height:24px;border-radius:6px;border:2px solid var(--line-2);display:grid;place-items:center;margin-top:2px}
.check[aria-pressed="true"] .box{background:var(--ok);border-color:var(--ok)}
.check[aria-pressed="true"] .box::after{content:"";width:10px;height:6px;border:solid #fff;border-width:0 0 2.5px 2.5px;transform:rotate(-45deg) translate(1px,-1px)}
.check[aria-pressed="true"] .ttl{text-decoration:line-through;color:var(--ink-2)}
.item{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px;display:grid;gap:6px}
.prod{display:flex;gap:10px;align-items:flex-start}
.prod .check{flex:1;min-width:0}
.thumb{flex:none;width:76px;height:76px;border-radius:10px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;overflow:hidden}
.thumb img{max-width:100%;max-height:100%;object-fit:contain}
.item .jpbig{font-size:18px;font-weight:700;font-family:"Noto Sans TC",sans-serif}
.styles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.sw{display:grid;gap:6px;text-align:left;padding:10px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface)}
.sw[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.sw .bar{display:flex;height:14px;border-radius:4px;overflow:hidden}
.sw .bar i{flex:1}

/* bottom nav */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:var(--z-nav);background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(5,1fr)}
.tab{display:grid;justify-items:center;gap:2px;padding:6px 0;min-height:52px;border:0;background:none;color:var(--ink-2);font-size:12px;font-weight:500}
.tab[aria-current="page"]{color:var(--accent-ink)}
.tab .ico{width:22px;height:22px}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:var(--z-toast);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:999px;font-size:14px;max-width:calc(100% - 32px);opacity:0;transition:opacity .2s ease-out;pointer-events:none}
.toast.show{opacity:1}

dialog{border:0;padding:0;border-radius:18px;width:min(560px,calc(100% - 24px));max-height:calc(100% - 48px);background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(10,20,30,.55)}
.dlg{padding:20px;display:grid;gap:14px}
.dlg .big{font-size:30px;font-weight:700;line-height:1.35;font-family:"Noto Sans TC",sans-serif}
.dlg .mid{font-size:22px;font-weight:700;line-height:1.4}
.dlg .zh{font-size:14px;color:var(--ink-2)}
.dlg hr{border:0;border-top:1px solid var(--line);margin:0}
.wx{display:grid;gap:8px;margin-top:4px}
.hours{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(54px,1fr);gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.hours::-webkit-scrollbar{display:none}
.hr{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 4px;display:grid;justify-items:center;gap:1px;font-size:13px;font-variant-numeric:tabular-nums}
.hr b{font-size:12px;color:var(--ink-2);font-weight:500}
.hr .pop{color:var(--ink-2)}
.hr .pop.hi{color:var(--info);font-weight:700}
.hr .gust{color:var(--bad);font-weight:700}
.stamp{font-size:12px;color:var(--ink-2)}
.mapcard{margin-block:4px 16px;padding:14px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);display:grid;gap:10px}
.mapcard h3{font-size:17px;font-weight:700}
.map{width:100%;height:auto;max-height:560px;display:block;border-radius:var(--radius-sm)}
.m-sea{fill:color-mix(in srgb,var(--info-soft) 70%,var(--surface))}
.m-land path{fill:var(--surface);stroke:var(--line-2);stroke-width:1;stroke-linejoin:round}
.m-div{stroke:var(--ink-2);stroke-width:1;stroke-dasharray:3 4;opacity:.55}
.m-region{font-size:15px;font-weight:700;fill:var(--ink-2);opacity:.7}
.m-town{font-size:10px;fill:var(--ink-2)}
.m-route{fill:none;stroke:var(--accent);stroke-width:2;stroke-dasharray:5 4;stroke-linejoin:round}
.m-cand{fill:var(--surface);stroke:var(--ink-2);stroke-width:1.5;opacity:.8}
.m-pin rect{fill:var(--accent);stroke:#fff;stroke-width:2}
.m-pin.home rect{fill:var(--ink)}
.m-pin text{font-size:11px;font-weight:700;fill:#fff;text-anchor:middle;font-family:"Noto Sans TC",sans-serif}
.legend{margin:0;padding:0;list-style:none;display:grid;gap:4px;font-size:14px}
.legend li{display:flex;gap:8px;align-items:center}
.m-n{flex:none;width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center}
.m-n.home{background:var(--ink)}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums;background:var(--surface)}
.tbl th,.tbl td{border:1px solid var(--line);padding:6px 8px;text-align:center;white-space:nowrap}
.tbl th{font-weight:500;color:var(--ink-2);background:var(--surface-2)}
.tbl td.hi{color:var(--info);font-weight:700}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="top">
  <div class="wrap">
    <p class="coord mono" id="coord">26.21°N 127.68°E · 那霸</p>
    <h1 id="ttl">沖繩五日自駕</h1>
    <div class="days" id="days" role="group" aria-label="選擇日期"></div>
  </div>
</header>
<main class="wrap" id="view" aria-live="polite"></main>
<nav class="tabs" id="tabs" aria-label="分頁"></nav>

// Only trusts closed_days (a field that lists closures) plus an explicit "10/5（一）公休" in open_during_trip.
function closedOn(p, date) {
  if (!date) return false;
  const dt = new Date(date + 'T12:00:00Z'), w = dt.getUTCDay(), nth = Math.ceil(dt.getUTCDate() / 7);
  if (new RegExp(`${md(date)}\\s*[（(][^）)]*[）)]\\s*公休`).test(p.open_during_trip || '')) return true;
  const c = (p.closed_days || '').replace(/[１-５]/g, d => '１２３４５'.indexOf(d) + 1);
  if (!c || /無休/.test(c)) return false;
  for (const day of ['日月火水木金土'[w] + '曜', '週' + '日一二三四五六'[w], '星期' + '日一二三四五六'[w]]) {
    const re = new RegExp(`(第([0-9・,、]+)個?)?${day}`, 'g');
    for (const m of c.matchAll(re)) {
      if (!m[2]) return true;
      if (m[2].split(/[・,、]/).map(Number).includes(nth)) return true;
    }
  }
  return false;
}
function legText(v, mode) {
  if (!v || v === '—') return '';
  return /^\d/.test(v) ? `${mode === 'walk' ? '走' : '開車'} ${v} 分` : v;
}

      <div class="row">
        ${phone ? `<button class="btn" data-act="copy" data-text="${esc(phone)}">${ico('copy')}電話 ${esc(phone)}</button>` : ''}
        ${p.mapcode ? `<button class="btn" data-act="copy" data-text="${esc(p.mapcode)}">${ico('copy')}<span class="mono">MAPCODE ${esc(p.mapcode)}</span></button>` : ''}

      </div>
      ${!phone && !p.mapcode ? `<p class="tiny muted">車機沒有電話或 MAPCODE 可輸入，用手機 Google Maps 導航。</p>` : ''}
      <div class="row">
        ${sig.length && ['eat','drink'].includes(p.category) ? `<button class="btn" data-act="staff" data-id="${esc(p.id)}">給店員看</button>` : ''}
        <a class="btn" href="${mapUrl(p)}" target="_blank" rel="noopener">地圖、評論</a>

const WC = D.wxcfg;
const JMA = 'https://www.jma.go.jp/bosai';
const WMO = {0:'晴',1:'大致晴',2:'晴時多雲',3:'陰',45:'霧',48:'霧',51:'毛毛雨',53:'毛毛雨',55:'毛毛雨',61:'小雨',63:'雨',65:'大雨',80:'陣雨',81:'陣雨',82:'強陣雨',95:'雷雨',96:'雷雨',99:'雷雨'};
const JCODE = {'100':'晴','101':'晴時々曇','102':'晴一時雨','103':'晴時々雨','110':'晴後時々曇','111':'晴後曇','112':'晴後一時雨','113':'晴後時々雨','114':'晴後雨','200':'曇','201':'曇時々晴','202':'曇一時雨','203':'曇時々雨','210':'曇後時々晴','211':'曇後晴','212':'曇後一時雨','213':'曇後時々雨','214':'曇後雨','300':'雨','301':'雨時々晴','302':'雨時々止む','308':'大雨','311':'雨後晴','313':'雨後曇','350':'雷雨'};
const WARN = {'02':'暴風雪警報','03':'大雨警報','04':'洪水警報','05':'暴風警報','07':'波浪警報','08':'高潮警報','10':'大雨注意報','14':'雷注意報','15':'強風注意報','16':'波浪注意報','18':'洪水注意報','19':'高潮注意報','20':'濃霧注意報','21':'乾燥注意報','33':'大雨特別警報','35':'暴風特別警報','37':'波浪特別警報','38':'高潮特別警報'};
const NAHA = [26.215, 127.681];
function ja2zh(s) {
  s = String(s || '').replace(/　/g, '').replace(/晴れ/g, '晴').replace(/くもり|曇/g, '陰');
  [['時々','時'],['一時','偶'],['後','轉'],['所により','局部'],['雷を伴う','有雷'],['夕方','傍晚'],['夜のはじめ頃','入夜'],['昼前','中午前'],['昼過ぎ','午後'],['明け方','清晨'],['朝','早上'],['夜','夜間'],['まで','前'],['から','起'],['激しく','強'],['降る','']]
    .forEach(([a, b]) => { s = s.split(a).join(b); });
  return s;
}
function distKm(a, b) {
  const r = x => x * Math.PI / 180, [la1, lo1, la2, lo2] = [a[0], a[1], b[0], b[1]].map(r);
  const h = Math.sin((la2 - la1) / 2) ** 2 + Math.cos(la1) * Math.cos(la2) * Math.sin((lo2 - lo1) / 2) ** 2;
  return Math.round(12742 * Math.asin(Math.sqrt(h)));
}
function parseWx(raw) {
  const out = {fetched: raw.fetched, source: raw.source, points: {}, jma: {}, week: {}, warn: [], tcs: []};
  const ids = Object.keys(WC.points);
  const om = raw.om ? (Array.isArray(raw.om) ? raw.om : [raw.om]) : [];
  ids.forEach((id, i) => {
    const r = om[i]; if (!r || !r.daily) return;
    const d = r.daily, h = r.hourly;
    out.points[id] = {label: WC.points[id][0], region: WC.points[id][3],
      daily: Object.fromEntries(d.time.map((t, k) => [t, {tmax: d.temperature_2m_max[k], tmin: d.temperature_2m_min[k], pop: d.precipitation_probability_max[k], rain: d.precipitation_sum[k], wind: d.wind_speed_10m_max[k]}])),
      hourly: h.time.map((t, k) => ({date: t.slice(0, 10), hour: +t.slice(11, 13), temp: h.temperature_2m[k], pop: h.precipitation_probability[k], rain: h.precipitation[k], code: h.weather_code[k], wind: h.wind_speed_10m[k], gust: h.wind_gusts_10m[k]}))};
  });
  if (Array.isArray(raw.fc) && raw.fc.length > 1) {
    const [s, wk] = raw.fc, t0 = s.timeSeries[0];
    out.jmaReport = s.reportDatetime;
    t0.areas.forEach(a => { out.jma[a.area.name] = Object.fromEntries(t0.timeDefines.map((t, k) => [t.slice(0, 10), (a.weathers || [])[k] || ''])); });
    const w0 = wk.timeSeries[0], w1 = wk.timeSeries[1], a0 = w0.areas[0], a1 = w1.areas[0];
    w0.timeDefines.forEach((t, k) => { out.week[t.slice(0, 10)] = {text: JCODE[a0.weatherCodes[k]] || '', pop: a0.pops[k], tmin: a1.tempsMin[k], tmax: a1.tempsMax[k], rel: (a0.reliabilities || [])[k] || ''}; });
  }
  if (raw.warn && raw.warn.areaTypes) {
    const names = {'471010':'本島中南部','471020':'本島北部'};
    raw.warn.areaTypes[0].areas.filter(a => names[a.code]).forEach(a => {
      out.warn.push({region: names[a.code], items: (a.warnings || []).filter(x => x.status === '発表' || x.status === '継続').map(x => WARN[x.code] || x.code)});
    });
    out.warnHeadline = raw.warn.headlineText || '';
  }
  (raw.specs || []).forEach(spec => {
    if (!Array.isArray(spec)) return;
    const title = spec[0], part = p => p && typeof p.part === 'object' ? p.part.jp || '' : '';
    const now = spec.find(p => part(p) === '実況'); if (!now) return;
    const fcs = spec.filter(p => part(p).startsWith('予報') && p.position);
    const d0 = distKm(now.position.deg, NAHA), dl = fcs.length ? distKm(fcs[fcs.length - 1].position.deg, NAHA) : d0;
    out.tcs.push({no: String(title.typhoonNumber || '').slice(-2), name: (title.name || {}).jp || '', intensity: now.intensity || '', loc: now.location || '', course: now.course || '', pressure: now.pressure || '', dist: d0, trend: dl > d0 + 50 ? '遠離中' : dl < d0 - 50 ? '接近中' : ''});
  });
  return out;
}
let WXD = D.wxsnap ? parseWx({...D.wxsnap, source: 'snapshot'}) : null;
async function getJSON(url, ms) {
  const c = new AbortController(), t = setTimeout(() => c.abort(), ms || 8000);
  try { const r = await fetch(url, {signal: c.signal, cache: 'no-store'}); if (!r.ok) throw new Error(r.status); return await r.json(); }
  finally { clearTimeout(t); }
}
async function loadWx() {
  try {
    const pts = Object.values(WC.points);
    const om = await getJSON(`https://api.open-meteo.com/v1/forecast?latitude=${pts.map(p => p[1])}&longitude=${pts.map(p => p[2])}&${WC.om_query}`);
    const [fc, warn, tcs] = await Promise.all([
      getJSON(`${JMA}/forecast/data/forecast/${WC.office}.json`).catch(() => null),
      getJSON(`${JMA}/warning/data/warning/${WC.office}.json`).catch(() => null),
      getJSON(`${JMA}/typhoon/data/targetTc.json`).catch(() => [])]);
    const specs = (await Promise.all((tcs || []).map(t => getJSON(`${JMA}/typhoon/data/${t.tropicalCyclone}/specifications.json`).catch(() => null)))).filter(Boolean);
    WXD = parseWx({om, fc, warn, specs, fetched: new Date().toISOString(), source: 'live'});
  } catch (e) {
    try {
      const f = await getJSON('weather.json', 5000);
      if (!WXD || Date.parse(f.fetched) > Date.parse(WXD.fetched)) WXD = parseWx({...f, source: 'file'});
    } catch (e2) { /* keep the build-time snapshot */ }
  }
  if (S.tab === 'plan' || S.tab === 'news') { const y = window.scrollY; render(); window.scrollTo(0, y); }
}
function wxStamp() {
  if (!WXD) return '沒有天氣資料';
  const t = new Date(Date.parse(WXD.fetched)), ago = Math.round((Date.now() - t) / 3600000);
  const j = new Date(t.getTime() + (t.getTimezoneOffset() + 540) * 60000);
  const when = `${j.getMonth() + 1}/${j.getDate()} ${pad(j.getHours())}:${pad(j.getMinutes())}`;
  return WXD.source === 'live' ? `即時資料（氣象廳、Open-Meteo），${when} 更新` : `快照資料，${when} 抓取${ago >= 1 ? `（${ago} 小時前）` : ''}`;
}
const LIVE_LINKS = [

function wxAlerts(regions) {
  if (!WXD) return '';

  const tc = WXD.tcs.filter(t => t.dist < 1000);
  return items.map(n => `<span class="chip ${/警報/.test(n) && !/注意報/.test(n) ? 'bad' : 'warn'}">${esc(n)}</span>`).join('') +
    tc.map(t => `<span class="chip warn">颱風 ${esc(t.no)} 號 距那霸 ${t.dist} km${t.trend ? '，' + t.trend : ''}</span>`).join('');

function dayWx(day) {
  if (!WXD) return '';
  const ids = day.wx || ['naha'], regions = [...new Set(ids.map(id => WC.points[id][3]))];
  const wk = WXD.week[day.date], jt = WXD.jma[regions[0]] && WXD.jma[regions[0]][day.date];
  const chips = [];
  if (jt || wk) chips.push(`<span class="chip acc">氣象廳：${esc(jt ? ja2zh(jt) : ja2zh(wk.text))}${wk && wk.pop ? ` · ${esc(wk.pop)}%` : ''}</span>`);
  ids.forEach(id => { const p = WXD.points[id], d = p && p.daily[day.date]; if (d) chips.push(`<span class="chip">${esc(p.label)} ${Math.round(d.tmin)}–${Math.round(d.tmax)}° · 降雨 ${d.pop ?? '—'}%</span>`); });
  const main = WXD.points[ids[0]];
  const hrs = main ? main.hourly.filter(h => h.date === day.date && h.hour % 3 === 0 && h.hour >= 6) : [];
  const strip = hrs.length ? `<div class="hours" role="list" aria-label="${esc(main.label)}逐 3 小時">${hrs.map(h => `<div class="hr" role="listitem"><b>${pad(h.hour)} 時</b><span>${esc(WMO[h.code] || '')}</span><span>${Math.round(h.temp)}°</span><span class="pop${h.pop >= 50 ? ' hi' : ''}">${h.pop ?? '—'}%</span><span class="${h.gust >= 15 ? 'gust' : 'tiny'}">風 ${Math.round(h.wind)}${h.gust >= 15 ? `／陣 ${Math.round(h.gust)}` : ''}</span></div>`).join('')}</div>` : '';

function newsWx() {

// --- day map: hand-drawn SVG of Okinawa Island, pins projected from lat/lon (no map API, works offline) ---
const ISLAND = [26.05, 26.95, 127.60, 128.36];  // lat min/max, lon min/max
const TOWNS = [['那霸', 26.212, 127.679], ['北谷', 26.32, 127.76], ['讀谷', 26.40, 127.74], ['恩納', 26.49, 127.84], ['名護', 26.59, 127.98], ['本部', 26.66, 127.88], ['古宇利', 26.71, 128.02]];
const REGIONS = [['北部', 26.62, 127.66], ['中部', 26.36, 127.64], ['南部', 26.13, 127.61]];
const DIVIDERS = [[[26.268, 127.69], [26.232, 127.80]], [[26.43, 127.72], [26.44, 127.87]]];  // 南部｜中部, 中部｜北部 (approximate)
function dayStops(day) {
  const stops = [], picks = [];
  day.items.forEach(it => {
    if (it.type === 'fixed' && it.place && P[it.place] && P[it.place].ll) stops.push({p: P[it.place], label: it.title, time: it.time});
    if (it.type === 'slot') {
      (S.picks[it.id] || []).forEach(id => { const p = P[id]; if (p && p.ll) stops.push({p, label: p.name_zh || p.name_ja, time: it.time, pick: true}); });
      (it.options || []).forEach(o => { const p = P[o.place]; if (p && p.ll && !(S.picks[it.id] || []).includes(o.place)) picks.push(p); });
    }
  });
  const hotel = P[D.trip.hotel], km = (a, b) => distKm(a.ll, b.ll);
  const last = D.days[D.days.length - 1].id === day.id;
  if (hotel && hotel.ll && stops.length && km(stops[0].p, hotel) > 1.5 && day.id !== D.days[0].id) stops.unshift({p: hotel, label: '飯店出發', home: true});
  if (hotel && hotel.ll && stops.length && km(stops[stops.length - 1].p, hotel) > 1.5 && !last) stops.push({p: hotel, label: '回飯店', home: true});
  const seen = new Set();
  return {stops, cands: picks.filter(p => !seen.has(p.id) && seen.add(p.id))};
}
function mapSvg(day) {
  const {stops, cands} = dayStops(day);
  const zoom = S.mapZoom && stops.length > 1;
  let [la0, la1, lo0, lo1] = ISLAND;
  if (zoom) {
    const pts = [...stops.map(s => s.p.ll), ...cands.map(p => p.ll)];
    la0 = Math.min(...pts.map(x => x[0])); la1 = Math.max(...pts.map(x => x[0])); lo0 = Math.min(...pts.map(x => x[1])); lo1 = Math.max(...pts.map(x => x[1]));
    const pad = Math.max(0.03, (la1 - la0) * 0.12, (lo1 - lo0) * 0.12);
    la0 -= pad; la1 += pad; lo0 -= pad; lo1 += pad;
  }
  const kx = Math.cos(26.5 * Math.PI / 180), W = 340;
  const scale = Math.min(W / ((lo1 - lo0) * kx), 520 / (la1 - la0)), H = Math.round((la1 - la0) * scale);
  const width = Math.round((lo1 - lo0) * kx * scale);
  const xy = ll => [((ll[1] - lo0) * kx * scale).toFixed(1), ((la1 - ll[0]) * scale).toFixed(1)];
  const land = D.outline.map(r => `<path d="M${r.map(xy).join('L')}Z"/>`).join('');
  const route = stops.length > 1 ? `<polyline class="m-route" points="${stops.map(s => xy(s.p.ll).join(',')).join(' ')}"/>` : '';
  // stops closer than a pin's width share one marker ("4·5") at their true position instead of being pushed aside
  const groups = [];
  stops.forEach((s, i) => {
    const [x, y] = xy(s.p.ll).map(Number), n = s.home ? 'H' : String(stops.slice(0, i + 1).filter(t => !t.home).length);
    const g = groups.find(g => Math.hypot(g.x - x, g.y - y) < 16);
    if (g) { if (!g.ns.includes(n)) g.ns.push(n); g.home = g.home && s.home; } else groups.push({x, y, ns: [n], home: !!s.home});
  });
  const pins = groups.map(g => {
    const t = g.ns.join('·'), w = Math.max(20, 8 + t.length * 7);
    const cx = Math.min(Math.max(g.x, w / 2 + 2), width - w / 2 - 2), cy = Math.min(Math.max(g.y, 12), H - 12);  // keep long labels inside the map
    return `<g class="m-pin${g.home ? ' home' : ''}"><rect x="${(cx - w / 2).toFixed(1)}" y="${(cy - 10).toFixed(1)}" width="${w}" height="20" rx="10"/><text x="${cx.toFixed(1)}" y="${(cy + 4).toFixed(1)}">${t}</text></g>`;
  }).join('');
  const dots = cands.map(p => { const [x, y] = xy(p.ll); return `<circle class="m-cand" cx="${x}" cy="${y}" r="4"><title>${esc(p.name_zh || p.name_ja)}</title></circle>`; }).join('');
  const labels = zoom ? '' : [...REGIONS.map(([t, a, o]) => { const [x, y] = xy([a, o]); return `<text class="m-region" x="${x}" y="${y}">${t}</text>`; }),
    ...DIVIDERS.map(([a, b]) => `<line class="m-div" x1="${xy(a)[0]}" y1="${xy(a)[1]}" x2="${xy(b)[0]}" y2="${xy(b)[1]}"/>`),
    ...TOWNS.map(([t, a, o]) => { const [x, y] = xy([a, o]); return `<text class="m-town" x="${(+x + 6).toFixed(1)}" y="${y}">${t}</text>`; })].join('');
  const legend = stops.map((s, i) => `<li><span class="m-n${s.home ? ' home' : ''}">${s.home ? 'H' : stops.slice(0, i + 1).filter(t => !t.home).length}</span>${esc(s.label)}${s.pick ? ' <span class="chip acc">已選</span>' : ''}</li>`).join('');
  // Google Maps takes at most 9 waypoints, so long days become several links of up to 11 stops that share endpoints
  const way = stops.map(s => s.p.ll.join(',')), legs = [];
  for (let i = 0; i < way.length - 1; i += 10) legs.push(way.slice(i, i + 11));
  const mode = day.id === 'd1' ? 'walking' : 'driving';
  const gmaps = legs.map((w, i) => `<a class="btn${i ? '' : ' primary'}" href="https://www.google.com/maps/dir/?api=1&origin=${w[0]}&destination=${w[w.length - 1]}${w.length > 2 ? '&waypoints=' + enc(w.slice(1, -1).join('|')) : ''}&travelmode=${mode}" target="_blank" rel="noopener">${ico('nav')}${legs.length > 1 ? `整天路線 第 ${i + 1} 段` : '在 Google Maps 看整天路線'}</a>`).join('');
  return `<section class="mapcard" aria-label="今天的路線示意圖">
    <div class="row" style="justify-content:space-between"><h3>今天去哪裡</h3>
      <div class="row"><button class="fbtn" data-act="mapzoom" data-id="0" aria-pressed="${!zoom}">全島</button><button class="fbtn" data-act="mapzoom" data-id="1" aria-pressed="${!!zoom}">放大今天</button></div></div>
    <svg class="map" viewBox="0 0 ${width} ${H}" role="img" aria-label="沖繩本島示意圖，標出今天 ${stops.length} 個停靠點">
      <rect class="m-sea" width="${width}" height="${H}"/><g class="m-land">${land}</g>${labels}${route}${dots}${pins}</svg>
    <ol class="legend">${legend}</ol>
    <p class="stamp">數字是今天的順序；空心小點是還沒選的候選地點，選了之後會變成數字。直線只表示順序，不是實際路線。</p>
    ${gmaps ? `<div class="row">${gmaps}</div>` : ''}
  </section>`;
}

             ['notes', '注意事項', ''],
             ['shop', '必買', `${shopItems.filter(i => S.bought[i.id]).length}/${shopItems.length}`]];
  const nav = `<div class="filters" role="group" aria-label="清單" style="padding-top:16px">${T.map(([k, v, n]) => `<button class="fbtn" data-act="listtab" data-id="${k}" aria-pressed="${S.listTab === k}">${v}${n ? ` <span class="tiny">${n}</span>` : ''}</button>`).join('')}</div>`;
  let body = '';
  if (S.listTab === 'before') body = `<div class="sec"><h2>出國前要完成</h2><p class="small muted">勾選只記在你這支手機，每個人各自勾。</p><div class="list">${C.before.map(t => `<div class="stack" style="gap:6px">${checkBtn('todo', t.id, S.todo[t.id], t.text, [t.due, t.note].filter(Boolean).join(' · '))}${t.phone ? `<div class="row"><button class="btn" data-act="copy" data-text="${esc(t.phone)}">${ico('copy')}電話 ${esc(t.phone)}</button></div>` : ''}</div>`).join('')}</div></div>`;
  else if (S.listTab === 'pack') body = C.pack.map(g => `<div class="sec"><h2>${esc(g.group)}</h2><div class="list">${g.items.map(i => checkBtn('pack', i.id, S.pack[i.id], i.text, i.note)).join('')}</div></div>`).join('');
  else if (S.listTab === 'notes') body = `<div class="sec"><h2>現在出國要注意</h2><div class="list">${C.notes.map(n => `<div class="item"><p><b>${esc(n.title)}</b></p><p class="small">${esc(n.body)}</p></div>`).join('')}</div><p class="small muted">規定會變動，航空公司和海關以官方最新公告為準。</p></div>`;
  else body = renderShop();
  return nav + body;
}

// --- news view ---
function renderNews() {
  const n = D.news || {};
  const q = ['青の洞窟','うんなまつり 花火','美浜 花火','瀬長島','古宇利島','沖縄 渋滞'];
  return `${newsWx()}
    <div class="sec"><h2>會影響行程的消息</h2><p class="small muted">資料時間：${esc(n.retrieved_at || '')}</p><div class="list">${(n.news || []).map(x => `<div class="item">
      <div class="row"><span class="chip">${esc(x.date)}</span><span class="chip ${x.confidence === 'high' ? 'ok' : 'warn'}">可信度 ${esc({high:'高',med:'中',low:'低'}[x.confidence] || '')}</span></div>
      <p><b>${esc(x.title_zh)}</b></p><p class="small">${esc(x.impact_zh)}</p>
      ${x.source ? `<div class="src"><a href="${esc(x.source)}" target="_blank" rel="noopener">來源</a></div>` : ''}</div>`).join('')}</div></div>
    <div class="sec"><h2>最近很紅</h2><p class="small muted">Threads 大多要登入才看得到，這裡標明每則的來源平台。現場想看最新的，用下面的 Threads 按鈕直接搜。</p>
      <div class="row">${q.map(s => `<a class="btn" href="${threadsUrl(s)}" target="_blank" rel="noopener">Threads：${esc(s)}</a>`).join('')}</div>
      <div class="list">${(n.trending || []).map(t => `<div class="item"><div class="row"><span class="chip acc">${esc(t.platform)}</span><span class="chip">${esc(AREA[t.area] || '')}</span></div>
        <p><b>${esc(t.name_zh)}</b> <span class="tiny muted">${esc(t.name_ja || '')}</span></p><p class="small">${esc(t.why_zh)}</p>
        ${t.url ? `<div class="src"><a href="${esc(t.url)}" target="_blank" rel="noopener">看原文</a></div>` : ''}</div>`).join('')}</div></div>`;
}

// --- info view ---
function picksText() {
  const lines = [];
  D.days.forEach(d => d.items.forEach(it => {
    if (it.type !== 'slot') return;
    const ids = S.picks[it.id] || [];
    if (ids.length) lines.push(`${md(d.date)} ${it.title}：${ids.map(id => (P[id] || {}).name_zh || id).join('、')}`);
  }));
  return lines.length ? lines.join('\n') : '還沒選任何選項';
}
function renderInfo() {
  const hotel = P[D.trip.hotel] || {};
  return `<div class="sec"><h2>視覺風格</h2><div class="styles">${STYLES.map(s => `<button class="sw" data-act="style" data-id="${s.id}" aria-pressed="${(S.style || 'kaizu') === s.id}"><span class="bar">${s.colors.map(c => `<i style="background:${c}"></i>`).join('')}</span><b>${esc(s.label)}</b></button>`).join('')}</div></div>
    <div class="sec"><h2>出發前待辦</h2><p class="small muted">搬到「清單」分頁了：出發前、行李、注意事項、必買都在那裡。</p><div class="row"><button class="btn" data-act="tab" data-id="list">打開清單</button></div></div>
    <div class="sec"><h2>我的選擇</h2><p class="small muted">選擇只存在你這支手機。複製後貼到 LINE 群組，或貼給 Claude 更新成大家的版本。</p>
      <div class="info"><p style="white-space:pre-line">${esc(picksText())}</p></div>
      <div class="row"><button class="btn primary" data-act="copypicks">${ico('copy')}複製我的選擇</button></div></div>
    <div class="sec"><h2>飯店</h2><div class="item"><p><b>${esc(hotel.name_ja || '')}</b></p><p class="small">${esc(hotel.address_ja || '')}</p><p class="small muted">${esc(hotel.parking || '')}</p>
      <div class="row"><button class="btn primary" data-act="taxi">給司機看地址</button>${hotel.address_ja ? `<button class="btn" data-act="copy" data-text="${esc(hotel.address_ja)}">${ico('copy')}複製地址</button>` : ''}</div></div></div>
    <div class="sec"><h2>緊急電話</h2><div class="list">${D.emergency.map(e => `<div class="item"><div class="row" style="justify-content:space-between"><span>${esc(e.label)}</span><button class="btn" data-act="copy" data-text="${esc(e.value)}"><span class="mono">${esc(e.value)}</span></button></div></div>`).join('')}</div></div>
    <div class="sec"><h2>點餐會話卡</h2><div class="row"><button class="btn primary" data-act="phrases">打開會話卡</button></div></div>
    <div class="sec"><h2>自駕守則</h2><div class="info">${D.rules.map(r => `<p>${esc(r)}</p>`).join('')}</div></div>
    <div class="sec"><h2>資料說明</h2><p class="small muted">店家資料在 9/28 查證，每個地點都標了可信度和來源。大部分店家查不到 MAPCODE，車機導航改輸入電話，或直接用手機 Google Maps。車程是路況順時的估計，另外加了緩衝時間。</p></div>`;
}

// --- dialogs ---
const dlg = $('#dlg'), body = $('#dlgbody');
function openDlg(html) { body.innerHTML = html + '<button class="btn primary" data-act="close">關閉</button>'; if (dlg.showModal) dlg.showModal(); else dlg.setAttribute('open', ''); }
const phrasesHtml = () => (D.phrases || []).map(x => `<div><p class="mid">${esc(x.ja)}</p><p class="zh">${esc(x.zh)} · ${esc(x.romaji || '')}</p></div>`).join('<hr>');

// --- render ---
function renderTabs() {
  const T = [['plan','行程'],['near','附近'],['list','清單'],['news','情報'],['info','資訊']];
  $('#tabs').innerHTML = T.map(([k, v]) => `<button class="tab" data-act="tab" data-id="${k}"${S.tab === k ? ' aria-current="page"' : ''}>${ico(k)}<span>${v}</span></button>`).join('');
  $('#days').innerHTML = D.days.map(d => `<button class="daybtn" data-act="day" data-id="${d.id}" aria-pressed="${S.day === d.id}">${esc(md(d.date))}（${esc(d.dow)}）${d.date === todayStr ? '<span class="today">今天</span>' : ''}</button>`).join('');
  $('#days').hidden = S.tab !== 'plan';
}
function render() {
  applyStyle(); renderTabs();
  const v = $('#view');
  v.innerHTML = ({plan: renderPlan, near: renderNear, list: renderList, news: renderNews, info: renderInfo}[S.tab] || renderPlan)();
}

// --- events ---
let tt;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 2200); }
function copy(text) {
  const done = () => toast('已複製 ' + (text.length > 24 ? text.slice(0, 24) + '…' : text));
  try {
    navigator.clipboard.writeText(text).then(done, () => fallback(text));
  } catch (e) { fallback(text); }
}
function fallback(text) {
  openDlg(`<p class="zh">長按下面的文字選取複製</p><p class="mid" style="user-select:all;white-space:pre-line">${esc(text)}</p>`);
}
document.addEventListener('toggle', e => {
  const el = e.target; if (!el.matches || !el.matches('details[data-key]')) return;
  const k = el.dataset.key;
  el.open ? S.open.add(k) : S.open.delete(k);
  store.set('open', [...S.open].slice(-80));
  if (el.classList.contains('opts')) { const s = el.querySelector(':scope>summary'); const n = el.querySelectorAll('.opt').length; s.textContent = el.open ? '收起選項' : `看 ${n} 個選項`; }
}, true);
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const {act, id} = b.dataset;
  if (act === 'tab') { S.tab = id; store.set('tab', id); render(); window.scrollTo(0, 0); }
  else if (act === 'day') { S.day = id; store.set('day', id); render(); window.scrollTo(0, 0); }
  else if (act === 'style') { S.style = id; store.set('style', id); render(); toast('已換成 ' + STYLES.find(s => s.id === id).label); }
  else if (act === 'pick') {
    const slot = b.dataset.slot, cur = S.picks[slot] || [];
    const on = cur.includes(id);
    S.picks = {...S.picks, [slot]: on ? cur.filter(x => x !== id) : [...cur, id]};
    store.set('picks', S.picks);
    const y = window.scrollY; render(); window.scrollTo(0, y);
    toast(on ? '已從行程移除' : '已加入行程');
  }
  else if (act === 'listtab') { S.listTab = id; store.set('listTab', id); render(); }
  else if (act === 'bought' || act === 'todo' || act === 'pack') {
    const key = act;
    S[key] = {...S[key], [id]: !S[key][id]}; store.set(key, S[key]);
    b.setAttribute('aria-pressed', String(!!S[key][id]));
    if (S.tab === 'list') { const y = window.scrollY; render(); window.scrollTo(0, y); }
  }
  else if (act === 'mapzoom') { S.mapZoom = id === '1'; const y = window.scrollY; render(); window.scrollTo(0, y); }
  else if (act === 'area') { S.area = id; render(); }
  else if (act === 'cat') { S.cat = id; render(); }
  else if (act === 'copy') copy(b.dataset.text);
  else if (act === 'copypicks') copy(picksText());
  else if (act === 'staff') {
    const p = P[id];
    const sig = (p.signature || []).filter(s => typeof s === 'object');
    openDlg(`<p class="zh" id="dlgttl">給店員看</p><p class="big">${esc(p.name_ja || p.name_zh)}</p>
      ${sig.map(s => `<div><p class="mid">${esc(s.ja || s.zh)}</p><p class="zh">${esc(s.zh || '')} ${esc(s.price || '')}</p></div>`).join('<hr>')}
      <hr><p class="mid">4人です。</p><p class="zh">我們 4 個人</p><hr>${phrasesHtml()}`);
  }
  else if (act === 'staffitem') {
    const i = (D.shopping.items || []).find(x => x.id === id);
    openDlg(`<p class="zh" id="dlgttl">給店員看</p><p class="big">${esc(i.name_ja)}</p><p class="mid">これはありますか？</p><p class="zh">請問有這個嗎？（${esc(i.name_zh)}）</p>`);
  }
  else if (act === 'taxi') {
    const h = P[D.trip.hotel] || {};
    openDlg(`<p class="zh" id="dlgttl">給計程車司機看</p><p class="mid">このホテルまでお願いします。</p><p class="big">${esc(h.name_ja || '')}</p><p class="mid">${esc(h.address_ja || '')}</p><p class="zh">請載我們到這間飯店</p>`);
  }
  else if (act === 'phrases') openDlg(`<p class="zh" id="dlgttl">點餐會話卡</p>${phrasesHtml()}`);
  else if (act === 'close') dlg.close ? dlg.close() : dlg.removeAttribute('open');
});
dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });
document.addEventListener('error', e => { const a = e.target.closest && e.target.closest('.thumb'); if (a) a.remove(); }, true);
render();
loadWx();
setInterval(() => { if (!document.hidden) loadWx(); }, 30 * 60 * 1000);
})();
</script>
</body></html>
